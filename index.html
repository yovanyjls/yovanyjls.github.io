<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yovany Jesús López Serrano — Full Stack Developer</title>
<meta name="description" content="Portafolio profesional de Yovany Jesús López Serrano: experiencia, tecnologías y certificaciones." />
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
<div class="masthead">
  <div class="masthead-inner">
    <div>
      <h1 id="mHeading">Yovany Jesús López Serrano</h1>
      <div class="sub" id="mSub">Full Stack Developer</div>
    </div>
    <div class="controls-right">
      <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" id="langEs">ES</button>
        <button type="button" id="langEn">EN</button>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
    </div>
  </div>
  <nav class="seccion-nav">
    <a href="#perfil" id="navPerfil">Perfil</a>
    <a href="#experiencia" id="navExperiencia">Experiencia</a>
    <a href="#tecnologias" id="navTecnologias">Tecnologías</a>
    <a href="#cursos" id="navCursos">Cursos</a>
  </nav>
</div>

<div class="wrap">
  <section class="hero" id="perfil">
    <span class="kicker" id="pKicker">Perfil profesional</span>
    <h2 id="pNombre">Yovany Jesús López Serrano</h2>
    <div class="titulo" id="pTitulo">Full Stack Developer</div>
    <div class="contact-line" id="pContacto"></div>
    <p class="resumen" id="pResumen"></p>
    <a class="cta-link" id="ctaDescargarCV" href="cv-es.pdf" download>Descargar CV (PDF) ↓</a>
  </section>

  <section class="bloque" id="experiencia">
    <h3 id="hExperiencia">Experiencia laboral</h3>
    <div id="listaExperiencia"></div>
  </section>

  <section class="bloque" id="tecnologias">
    <h3 id="hTecnologias">Tecnologías</h3>
    <div class="tech-grid" id="gridTecnologias"></div>
    <details class="tech-secundaria" id="detalleSecundaria">
      <summary id="resumenSecundaria">Ver más tecnologías</summary>
      <div id="contenidoSecundaria"></div>
    </details>
  </section>

  <section class="bloque" id="cursos">
    <h3 id="hCursos">Cursos y certificaciones</h3>
    <ul class="cursos-lista" id="listaCursosDestacados"></ul>
    <a class="cta-link" id="ctaCursos" href="#" target="_blank" rel="noopener">Ver catálogo completo ↗</a>
  </section>

</div>
<script src="app.js?v=9"></script>
